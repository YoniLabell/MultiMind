<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <title>MultiMind</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button id="menu-btn" type="button" aria-label="Open conversations">
      <span></span><span></span><span></span>
    </button>
    <div class="brand">Multi<em>Mind</em></div>
    <button id="topbar-new-btn" type="button" aria-label="New chat">+</button>
  </header>

  <div id="backdrop" class="backdrop"></div>

  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <div class="brand">Multi<em>Mind</em></div>
      <button id="new-chat-btn" type="button">+ New chat</button>
    </div>
    <ul id="conversation-list" class="conversation-list"></ul>
    <div class="sidebar-footer">One history · five minds</div>
  </aside>

  <main class="chat">
    <div id="messages" class="messages">
      <div class="empty-state" id="empty-state">
        <div class="empty-logo">🧠</div>
        <h2>Start a conversation</h2>
        <p>Pick a provider and model below — you can switch on every message. The whole conversation history is shared between them.</p>
        <div class="empty-badges">
          <span class="badge openai">OpenAI</span>
          <span class="badge claude">Claude</span>
          <span class="badge gemini">Gemini</span>
          <span class="badge grok">Grok</span>
          <span class="badge deepseek">DeepSeek</span>
        </div>
      </div>
    </div>

    <form id="chat-form" class="composer">
      <div class="composer-toolbar">
        <select id="provider-select" title="Provider for the next message">
          <option value="auto" selected>✨ Auto</option>
          <option value="openai">OpenAI</option>
          <option value="claude">Claude</option>
          <option value="gemini">Gemini</option>
          <option value="grok">Grok</option>
          <option value="deepseek">DeepSeek</option>
          <option value="compare">⚡ Compare all</option>
        </select>
        <select id="model-select" title="Model"></select>
      </div>
      <div class="composer-input">
        <textarea id="message-input" rows="1" placeholder="Send a message…" required></textarea>
        <button id="send-btn" type="submit" aria-label="Send">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
        </button>
      </div>
    </form>
  </main>

  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
